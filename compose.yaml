services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: deal
      POSTGRES_PASSWORD: deal
      POSTGRES_DB: deal
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deal"]
      interval: 3s
      retries: 10
volumes:
  pgdata:
